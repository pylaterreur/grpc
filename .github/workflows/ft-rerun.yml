# Probe: rerun one grpcio test module on wheels built by earlier runs
# (base = grpc master, fix = is_shutdown branch), interleaved on the same
# runner, with the GIL off; on a hang, dump the C stacks of the client
# subprocess with gdb. Throwaway workflow.
name: grpcio rerun probe

on:
  push:
    branches: [ft-rerun-probe]

permissions:
  contents: read
  actions: read

env:
  GRPC_REPO: pylaterreur/grpc
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  TEST_MODULE: tests.unit._signal_handling_test
  ITERATIONS: "40"
  BASE_REF: 952c8d46d90530ddc497d22bdf4b4ccfce4e903c
  FIX_REF: 84dbbe91bc7f696582ff3ef6ab2464b31b39d095

jobs:
  rerun:
    name: interleaved rerun ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GRPC_REPO }}
          ref: ${{ env.BASE_REF }}
          path: grpc-src
          sparse-checkout: |
            src/python/grpcio_tests
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grpcio-git-${{ matrix.python }}-${{ env.BASE_REF }}
          run-id: "42421431027"
          github-token: ${{ github.token }}
          path: base-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grpcio-git-${{ matrix.python }}-${{ env.FIX_REF }}
          run-id: "42424620228"
          github-token: ${{ github.token }}
          path: fix-artifact
      - name: Create one venv per wheel
        run: |
          for v in base fix; do
            python -m venv "$RUNNER_TEMP/venv-$v"
            "$RUNNER_TEMP/venv-$v/bin/python" -m pip install -q $v-artifact/wheelhouse/grpcio-*.whl
            "$RUNNER_TEMP/venv-$v/bin/python" -m pip install -q "protobuf>=7.35.1,<8" coverage typeguard typing_extensions absl-py
          done
          sudo apt-get install -y -q gdb > /dev/null 2>&1 || true
          gdb --version | head -1
      - name: Interleaved reruns with the GIL off
        working-directory: grpc-src/src/python/grpcio_tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          # Job control: without it, bash starts background jobs with SIGINT
          # ignored, and the signal client inherits that disposition.
          set -m
          declare -A pass hang fail dumps
          for v in base fix; do pass[$v]=0; hang[$v]=0; fail[$v]=0; dumps[$v]=0; done
          for i in $(seq 1 "$ITERATIONS"); do
            for v in base fix; do
              log="$GITHUB_WORKSPACE/out/$v-run-$i.log"
              PYTHON_GIL=0 PYTHONFAULTHANDLER=1 "$RUNNER_TEMP/venv-$v/bin/python" -X gil=0 -m unittest -v "$TEST_MODULE" > "$log" 2>&1 &
              pid=$!
              for t in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
              if kill -0 $pid 2>/dev/null; then
                hang[$v]=$((hang[$v]+1))
                echo "iteration $i $v: hang"
                if [ "${dumps[$v]}" -lt 2 ]; then
                  dumps[$v]=$((dumps[$v]+1))
                  for c in $(pgrep -P $pid); do
                    echo "=== client $c: $(tr '\0' ' ' < /proc/$c/cmdline)" >> "$GITHUB_WORKSPACE/out/$v-hang-$i-gdb.txt"
                    sudo gdb -p $c -batch -ex 'info threads' -ex 'thread apply all bt 30' >> "$GITHUB_WORKSPACE/out/$v-hang-$i-gdb.txt" 2>&1 || true
                  done
                  sudo gdb -p $pid -batch -ex 'thread apply all bt 20' > "$GITHUB_WORKSPACE/out/$v-hang-$i-gdb-test.txt" 2>&1 || true
                fi
                pkill -KILL -P $pid || true
                kill -KILL $pid || true
                wait $pid 2>/dev/null || true
              else
                rc=0; wait $pid || rc=$?
                if [ $rc -eq 0 ]; then pass[$v]=$((pass[$v]+1)); else fail[$v]=$((fail[$v]+1)); echo "iteration $i $v: fail rc=$rc"; fi
              fi
            done
          done
          for v in base fix; do
            echo "RESULT variant=$v pass=${pass[$v]} fail=${fail[$v]} hang=${hang[$v]} of $ITERATIONS" | tee -a "$GITHUB_WORKSPACE/out/result.txt"
          done
          for f in "$GITHUB_WORKSPACE"/out/*-gdb.txt; do
            [ -f "$f" ] || continue
            echo "######## $f"
            grep -E '^=== client|^\* ?[0-9]+ |^  [0-9]+ +Thread|^Thread [0-9]+|^#[0-9]+ ' "$f" | head -n 160
            break
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: interleaved-rerun-${{ matrix.python }}
          path: out/
          retention-days: 7
