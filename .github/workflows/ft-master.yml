# Probe: build grpcio from a git ref (grpc master or a fix branch) on
# free-threaded CPython, then run the same import/unit/stress checks as
# ft-probe.yml. Throwaway investigation workflow on a personal fork.
name: grpcio git-ref free-threading probe

on:
  push:
    branches: [ft-master-probe]

permissions:
  contents: read

env:
  GRPC_REPO: pylaterreur/grpc
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  grpcio:
    name: grpcio ${{ matrix.ref }} ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        # python-server-is-shutdown-race (fix) on free-threaded and regular builds
        python: ["3.14t", "3.15t", "3.14"]
        ref: ["84dbbe91bc7f696582ff3ef6ab2464b31b39d095"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GRPC_REPO }}
          ref: ${{ matrix.ref }}
          path: grpc-src
          persist-credentials: false
      - name: Fetch the submodules the Python build needs
        working-directory: grpc-src
        run: |
          git log -1 --format='%H %cd %s'
          git submodule update --init --depth 1 --jobs 6 \
            third_party/abseil-cpp third_party/boringssl-with-bazel \
            third_party/cares/cares third_party/re2 third_party/zlib \
            third_party/cel-c
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build grpcio wheel from the checkout
        env:
          GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS: "4"
          GRPC_PYTHON_BUILD_WITH_CYTHON: "1"
        run: |
          mkdir -p out
          python -VV
          python -m pip install -U pip
          # Same build tool pins as tools/run_tests/artifacts/build_artifact_python.sh
          python -m pip install "setuptools==77.0.1" "wheel==0.43.0" "cython==3.2.8"
          start=$(date +%s)
          if ! python -m pip wheel --no-build-isolation --no-deps -w wheelhouse -v ./grpc-src > out/build-grpcio.log 2>&1; then
            tail -n 300 out/build-grpcio.log
            exit 1
          fi
          echo "grpcio build seconds: $(( $(date +%s) - start ))" | tee out/build-time.txt
          grep -m1 -E 'Cython version|Generated by Cython' out/build-grpcio.log || true
          ls -la wheelhouse
      - name: Install grpcio and test dependencies
        run: |
          python -m pip install wheelhouse/grpcio-*.whl
          python -m pip install "protobuf>=7.35.1,<8" coverage typeguard typing_extensions absl-py oauth2client google-auth requests
          python -m pip list | tee out/pip-list.txt
      - name: Import check
        run: |
          {
            echo "### default"; python probe/ci/import_check.py
            echo "### -X gil=0"; python -X gil=0 probe/ci/import_check.py
            echo "### PYTHON_GIL=0"; PYTHON_GIL=0 python probe/ci/import_check.py
          } 2>&1 | tee out/import-check.txt
      - name: Generate test protos (system Python + grpcio-tools wheel)
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/protoc-venv"
          "$RUNNER_TEMP/protoc-venv/bin/pip" install -q grpcio-tools
          cd grpc-src
          "$RUNNER_TEMP/protoc-venv/bin/python" -m grpc_tools.protoc -I. \
            --python_out=src/python/grpcio_tests --grpc_python_out=src/python/grpcio_tests \
            src/proto/grpc/testing/empty.proto src/proto/grpc/testing/messages.proto src/proto/grpc/testing/test.proto
          cd src/python/grpcio_tests
          find tests/unit tests_aio/unit -name '*_test.py' | sort | sed 's|\.py$||; s|/|.|g' \
            | grep -v -E '_dynamic_stubs_test$' > "$GITHUB_WORKSPACE/out/test_modules.txt"
          wc -l "$GITHUB_WORKSPACE/out/test_modules.txt"
      - name: Unit tests, GIL forced off (-X gil=0, PYTHON_GIL=0)
        if: endsWith(matrix.python, 't')
        continue-on-error: true
        run: python probe/ci/run_unit.py --tests-dir grpc-src/src/python/grpcio_tests --mode gil0 --out out/unit-gil0 --modules-file out/test_modules.txt
      - name: Unit tests, default mode
        continue-on-error: true
        run: python probe/ci/run_unit.py --tests-dir grpc-src/src/python/grpcio_tests --mode default --out out/unit-default --modules-file out/test_modules.txt
      - name: Stress, GIL forced off
        if: endsWith(matrix.python, 't')
        continue-on-error: true
        run: python probe/ci/run_stress.py --mode gil0 --out out/stress-gil0
      - name: Stress, default mode
        continue-on-error: true
        run: python probe/ci/run_stress.py --mode default --out out/stress-default
      - name: Summary
        if: always()
        run: |
          {
            echo "## grpcio ${{ matrix.ref }} ${{ matrix.python }}"
            echo '```'
            cat out/build-time.txt 2>/dev/null || true
            grep -E '^(###|GIL enabled|WARNING)' out/import-check.txt 2>/dev/null || true
            cat out/unit-gil0/summary.txt 2>/dev/null || true
            cat out/unit-default/summary.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grpcio-git-${{ matrix.python }}-${{ matrix.ref }}
          path: |
            out/
            wheelhouse/
          retention-days: 7
          if-no-files-found: warn
